name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The fast tests cover everything except the neural model itself, so PyTorch is not installed here
      - run: python -m pip install "numpy>=1.24" "soundfile>=0.12.1"
      - run: python -m compileall -q voxcpm_server scripts integrations tests
      - run: python -m unittest discover -s tests -v
      - name: Integration installers (dry run)
        shell: bash
        run: |
          for r in hermes openclaw claude-code codex gemini-cli opencode mcp-clients open-webui; do
            python integrations/install.py "$r" --dry-run --yes || true
          done

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install-linux.sh install-macos.sh start.sh doctor.sh integrate.sh
      - run: bash -n install-linux.sh && bash -n install-macos.sh

  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Write-Host "install-windows.ps1 parses cleanly"

  docker:
    name: Docker image (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg TORCH_BACKEND=cpu -t voxcpm2-voice-server:ci .
      - run: docker run --rm voxcpm2-voice-server:ci python -c "import voxcpm, torch, voxcpm_server; print('ok', torch.__version__)"
